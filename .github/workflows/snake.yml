name: Generate Oni Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: alan-quiroz

          outputs: |
            dist/github-snake.svg?color_snake=%23C6A15B&color_dots=%230A0A0A,%23240909,%234A0E0E,%237A1C1C,%23A52A2A
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23C6A15B&color_dots=%230A0A0A,%23240909,%234A0E0E,%237A1C1C,%23A52A2A

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
